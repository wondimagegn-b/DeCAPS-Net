# DeCAPS-Net skeleton branch — ASDPose SMM recognition (official train/test split)
# The H5 file is produced by preprocessing/asdpose/build_h5.py (see README).

work_dir: ./work_dir/asdpose_skeleton
phase: train
seed: 1
save_score: True
print_log: True

# -------------------------
# Feeder
# -------------------------
feeder: datasets.asdpose.ASDPose
num_worker: 8

train_feeder_args:
  data_path: ./data/asdpose/ASDpose.h5
  split: train
  window_size: 200
  debug: False

test_feeder_args:
  data_path: ./data/asdpose/ASDpose.h5
  split: test
  window_size: 200
  debug: False
  # clip-level evaluation over sliding windows
  test_multi_windows: True
  test_window_stride: 50
  test_include_tail: True

# -------------------------
# Model
# -------------------------
model: models.skeleton.decaps_skeleton.DeCAPSSkeleton

model_args:
  num_class: 2
  num_point: 17
  num_person: 1
  in_channels: 3
  num_frame: 200
  modalities: [joint, bone, joint_motion, bone_motion]  # ablation: any subset
  use_cadsgc: True      # ablation switches
  use_detgc: True
  use_tsm: True
  k: 8
  eta: 4
  num_stream: 2
  tsm_impl: htm
  graph: graphs.coco17.Graph
  graph_args:
    labeling_mode: spatial

# -------------------------
# Optimization
# -------------------------
optimizer: SGD
nesterov: True
base_lr: 0.01
weight_decay: 0.0004

step: [35, 60, 75]
warm_up_epoch: 5
cosine_epoch: 60

# Weighted cross-entropy (class imbalance)
loss_name: wce
loss_pos_weight: 2
loss_smoothing: 0.0

# -------------------------
# Training
# -------------------------
device: [0]
batch_size: 16
test_batch_size: 16
num_epoch: 100
start_epoch: 0
eval_interval: 1
save_interval: 1
log_interval: 10

# Binary eval / checkpoint selection
decision_threshold: 0.5
best_metric: f1
save_test_preds_csv: True
