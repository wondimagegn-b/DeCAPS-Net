# DeCAPS-Net — GFBMD fusion (parsing maps + skeleton), 5-fold subject-level CV
# Labels: ASD=1, TD=0
# Data files are produced by preprocessing/gfbmd/ (see README); paths are relative
# to the repository root — adjust data_dir/paths to your local layout.

work_dir: ./work_dir/gfbmd_fusion
phase: train
seed: 42
save_score: True
print_log: True

# Fixed subject-level CV folds (the trainer injects split/fold per run)
folds_json: ./data/gfbmd/folds_5_seed42.json

# -------------------------
# Feeder
# -------------------------
feeder: datasets.gfbmd_fusion.GFBMDFusion
num_worker: 0

train_feeder_args:
  manifest_csv: ./data/gfbmd/subject_manifest.csv
  skeleton_h5: ./data/gfbmd/GFBMD_skeleton_cache.h5
  folds_json: ./data/gfbmd/folds_5_seed42.json
  debug: False

  # Parsing branch (colorized parsing maps)
  parse_n_frames: 8
  parse_img_size: 224
  parse_imagenet_norm: True

  # Skeleton branch
  p_interval: [1.0]
  window_size: 64
  random_rot: True

val_feeder_args:
  manifest_csv: ./data/gfbmd/subject_manifest.csv
  skeleton_h5: ./data/gfbmd/GFBMD_skeleton_cache.h5
  folds_json: ./data/gfbmd/folds_5_seed42.json
  debug: False

  parse_n_frames: 8
  parse_img_size: 224
  parse_imagenet_norm: True

  p_interval: [1.0]
  window_size: 64
  random_rot: False

# -------------------------
# Model
# -------------------------
model: models.decaps_fusion.DeCAPSFusion

model_args:
  # Parsing branch
  parse_backbone_name: resnet18   # resnet18 | mobilenet_v3_small | efficientnet_b0 | vgg16 | vit_b_16
  parse_dropout: 0.30

  # Skeleton branch (single person, 25 Kinect joints)
  skel_num_point: 25
  skel_num_person: 1
  skel_in_channels: 3
  skel_k: 8
  skel_eta: 4
  skel_drop_out: 0.30
  skel_tsm_impl: legacy           # GFBMD used the legacy temporal block
  skel_graph: graphs.kinect25.Graph
  skel_graph_args:
    labeling_mode: spatial

  # Fusion head
  fusion_dropout: 0.30

# -------------------------
# Optimization
# -------------------------
optimizer: Adam
base_lr: 1e-4
weight_decay: 0.0004

step: [35, 60, 75]
warm_up_epoch: 5
cosine_epoch: 60

threshold: 0.5
monitor_metric: f1      # f1 / auc / ap / acc / loss
aux_loss_weight: 0.0

# -------------------------
# Training
# -------------------------
device: [0]
batch_size: 16
test_batch_size: 16
num_epoch: 50
start_epoch: 0
eval_interval: 1
save_interval: 1
log_interval: 10
amp: True
